<style>
  :root{
    --paper: #F2F4F8;
    --paper-raised: #FFFFFF;
    --ink: #1B2540;
    --ink-soft: #5B6788;
    --pine: #1D316E;
    --pine-deep: #122166;
    --brass: #8FA6C7;
    --brass-soft: #C7D3E6;
    --line: #DBE1EC;
    --ok: #2E7D5B;
    --ok-bg: #E4F1EA;
    --bad: #B23A3A;
    --bad-bg: #F6E5E1;
    --muted: #6484AB;
    --muted-bg: #E6EBF3;
    --pending: #B4790F;
    --pending-bg: #F7EAD3;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .mono{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, 'Courier New', monospace;}

  /* ---------- header ---------- */
  header{
    background: linear-gradient(155deg, var(--pine) 0%, var(--pine-deep) 100%);
    color:#EBF0FA;
    padding: 26px 32px;
    position:relative;
    overflow:hidden;
  }
  header::after{
    content:"";
    position:absolute; inset:0;
    background-image: repeating-linear-gradient(90deg, rgba(255,255,255,0.035) 0px, rgba(255,255,255,0.035) 1px, transparent 1px, transparent 34px);
    pointer-events:none;
  }
  .header-row{
    display:flex; justify-content:space-between; align-items:center; gap:20px; flex-wrap:wrap;
    position:relative; z-index:1;
  }
  .brand{
    display:flex; align-items:center; gap:16px;
  }
  .logo-card{
    background:#FFFFFF;
    border-radius:8px;
    padding:8px 14px;
    box-shadow:0 3px 10px rgba(8,16,40,0.25);
    flex:0 0 auto;
    line-height:0;
  }
  .logo-card img{ height:44px; display:block; }
  .brand-text .eyebrow{
    font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, 'Courier New', monospace;
    font-size:11px; letter-spacing:0.18em; text-transform:uppercase;
    color:var(--brass-soft); margin-bottom:6px;
  }
  h1{
    font-family:Georgia, 'Times New Roman', serif;
    font-weight:600; font-style:normal;
    font-size:32px; margin:0; line-height:1.05;
    letter-spacing:-0.01em;
    color:#FFFFFF;
  }
  .updated-badge{
    text-align:right;
    background:rgba(255,255,255,0.07);
    border:1px solid rgba(235,240,250,0.22);
    border-radius:8px;
    padding:9px 16px;
    white-space:nowrap;
  }
  .updated-badge .u-label{
    font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, 'Courier New', monospace;
    font-size:9.5px; letter-spacing:0.14em; text-transform:uppercase;
    color:var(--brass-soft); margin-bottom:3px;
    display:flex; align-items:center; gap:6px;
  }

// como un <script> (JSONP) — el truco clásico para leer hojas públicas desde
// cualquier origen sin backend propio.
function loadSheetViaJsonp(){
  return new Promise((resolve, reject) => {
    const cbName = 'gsheetsCb_' + Date.now() + '_' + Math.floor(Math.random()*1e6);
    let settled = false;
    const cleanup = () => {
      delete window[cbName];
      if(script.parentNode) script.parentNode.removeChild(script);
    };
    window[cbName] = function(data){
      if(settled) return;
      settled = true;
      cleanup();
      resolve(data);
    };
    const script = document.createElement('script');
    const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?gid=${SHEET_GID}&headers=1&tqx=out:json;responseHandler=${cbName}&_=${Date.now()}`;
    script.src = url;
    script.onerror = () => {
      if(settled) return;
      settled = true;
      cleanup();
      reject(new Error('No se pudo cargar el script de la planilla'));
    };
    document.body.appendChild(script);
    setTimeout(() => {
      if(settled) return;
      settled = true;
      cleanup();
      reject(new Error('Timeout esperando la planilla'));
    }, 9000);
  });
}

function gvizToRecords(data){
  const cols = (data.table && data.table.cols) || [];
  const numCols = Math.max(cols.length, 7);
  const rows = (data.table && data.table.rows) || [];
  return rows.map(row => {
    const r = [];
    for(let i=0;i<numCols;i++){
      const cell = row.c && row.c[i];
      r.push(cell && cell.v !== null && cell.v !== undefined ? String(cell.v) : '');
    }
    const productor = (r[0]||'').replace(/\s+/g,' ').trim();
    const compania = cleanCompania(r[1]);
    const estado = cleanEstado(r[2]);
    const ingreso = (r[3]||'').trim();
    const comercial = (r[4]||'').trim() || 'Sin asignar';
    const fecha_ingreso = (r[5]||'').trim();
    const fecha_fin = (r[6]||'').trim();
    const notas = r.slice(7).map(x=>(x||'').trim()).filter(Boolean);
    return { productor, compania, estado, ingreso, comercial, fecha_ingreso, fecha_fin, notas, estado_raw: (r[2]||'').trim() };
  }).filter(rec => rec.productor);
}

async function tryLiveFetch(){
  const data = await loadSheetViaJsonp();
  if(!data || !data.table) throw new Error('Respuesta inesperada de la planilla');
  const records = gvizToRecords(data);
  if(!records.length) throw new Error('La planilla no devolvió registros');
  return records;
}

function setUpdatedBadge(mode){
  const now = new Date();
  const dayName = now.toLocaleDateString('es-AR', { weekday:'long' });
  const day = now.getDate();
  const month = now.toLocaleDateString('es-AR', { month:'long' });
  const time = now.toLocaleTimeString('es-AR', { hour:'2-digit', minute:'2-digit' });
  const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
  document.getElementById('updatedAt').textContent = `${cap(dayName)} ${day} de ${month}, ${time} hs`;
  document.getElementById('updatedLabel').textContent = 'Foto de datos';
  document.getElementById('liveDot').classList.toggle('live', mode === 'live');
  document.getElementById('footerText').textContent = `${RECORDS.length} registros · Fuente: Google Sheets "Aperturas Códigos" (Grupo PAS).`;
}

function uniqueSorted(arr){
  return [...new Set(arr)].sort((a,b)=>a.localeCompare(b,'es'));
}

function populateSelect(id, values){
  const sel = document.getElementById(id);
  values.forEach(v=>{
    const opt = document.createElement('option');
    opt.value = v; opt.textContent = v;
    sel.appendChild(opt);
  });
}

function rebuildFilters(){
  [['estadoFilter','estado'],['comercialFilter','comercial'],['companiaFilter','compania']].forEach(([id,key])=>{
    const sel = document.getElementById(id);
    while(sel.options.length > 1){ sel.remove(1); }
    populateSelect(id, uniqueSorted(RECORDS.map(r=>r[key])));
  });
}

function renderStats(list){
  const total = list.length;
  const finalizados = list.filter(r=>r.estado === 'Finalizado').length;
  const rechazados = list.filter(r=>r.estado === 'Rechazado').length;
  const pendientes = total - finalizados - rechazados;
  const cards = [
    {label:'Total registros', num: total, cls:'total'},
    {label:'Finalizados', num: finalizados, cls:'ok'},
    {label:'Rechazados', num: rechazados, cls:'bad'},
    {label:'En gestión / otros', num: pendientes, cls:'pending'},
  ];
  document.getElementById('statsRow').innerHTML = cards.map(c=>`
    <div class="stat-card ${c.cls}">
      <div class="stat-num mono">${c.num}</div>
      <div class="stat-label">${c.label}</div>
    </div>
  `).join('');
}

function escapeHtml(s){
  return (s||'').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

function renderTable(list){
  const tbody = document.getElementById('tbody');
  const empty = document.getElementById('emptyState');
  document.getElementById('resultCount').textContent = `${list.length} de ${RECORDS.length} registros`;

  if(list.length === 0){
    tbody.innerHTML = '';
    empty.classList.remove('hidden');
    return;
  }
  empty.classList.add('hidden');

  tbody.innerHTML = list.map((r, i) => {
    const stampClass = STATUS_MAP[r.estado] || 'st-muted';
    const hasNotes = r.notas && r.notas.length > 0;
    const rowId = `notes-${i}`;
    return `
      <tr class="${hasNotes ? 'has-notes' : ''}" ${hasNotes ? `onclick="toggleNotes('${rowId}')"` : ''}>
        <td class="productor">${escapeHtml(r.productor)}</td>
        <td class="compania">${escapeHtml(r.compania)}</td>
        <td><span class="stamp ${stampClass}">${escapeHtml(r.estado)}</span></td>
        <td>${escapeHtml(r.comercial)}</td>
        <td class="compania">${escapeHtml(r.ingreso) || '—'}</td>
        <td class="dates">${escapeHtml(r.fecha_ingreso) || '—'}</td>
        <td class="dates">${escapeHtml(r.fecha_fin) || '—'}</td>
        <td class="notes-toggle">${hasNotes ? `▸ ${r.notas.length}` : '—'}</td>
      </tr>
      ${hasNotes ? `
      <tr class="notes-row hidden" id="${rowId}">
        <td colspan="8">
          <div class="notes-panel">
            ${r.notas.map(n => `<div class="note-item"><span class="note-dot">·</span><span>${escapeHtml(n)}</span></div>`).join('')}
          </div>
        </td>
      </tr>` : ''}
    `;
  }).join('');
}

function toggleNotes(id){
  document.getElementById(id).classList.toggle('hidden');
}

// Las fechas están en texto libre (dd/mm/aa, pero a veces con notas mezcladas).
// Solo reconocemos el patrón dd/mm/aa o dd/mm/aaaa; lo demás queda como "sin fecha".
function parseFechaDMY(s){
  if(!s) return null;
  const m = String(s).trim().match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})$/);
  if(!m) return null;
  let [, d, mo, y] = m;
  d = parseInt(d,10); mo = parseInt(mo,10); y = parseInt(y,10);
  if(y < 100) y += 2000;
  if(mo < 1 || mo > 12 || d < 1 || d > 31) return null;
  const dt = new Date(y, mo-1, d);
  if(isNaN(dt.getTime())) return null;
  return dt;
}

function applyFilters(){
  const q = document.getElementById('searchInput').value.trim().toLowerCase();
  const estado = document.getElementById('estadoFilter').value;
  const comercial = document.getElementById('comercialFilter').value;
  const compania = document.getElementById('companiaFilter').value;
  const periodoTipo = document.getElementById('periodoTipo').value; // 'fecha_ingreso' | 'fecha_fin'
  const desdeStr = document.getElementById('fechaDesde').value; // 'YYYY-MM-DD' o ''
  const hastaStr = document.getElementById('fechaHasta').value;
  const desde = desdeStr ? new Date(desdeStr + 'T00:00:00') : null;
  const hasta = hastaStr ? new Date(hastaStr + 'T23:59:59') : null;
  const periodoActivo = !!(desde || hasta);

  const filtered = RECORDS.filter(r => {
    if(estado && r.estado !== estado) return false;
    if(comercial && r.comercial !== comercial) return false;
    if(compania && r.compania !== compania) return false;
    if(q){
      const hay = (r.productor + ' ' + r.compania).toLowerCase();
      if(!hay.includes(q)) return false;
    }
    if(periodoActivo){
      const fecha = parseFechaDMY(r[periodoTipo]);
      if(!fecha) return false; // sin fecha reconocible: no entra en un rango de período
      if(desde && fecha < desde) return false;
      if(hasta && fecha > hasta) return false;
    }
    return true;
  });

  const note = document.getElementById('periodoNote');
  if(periodoActivo){
    const excluidos = RECORDS.length - RECORDS.filter(r => parseFechaDMY(r[periodoTipo])).length;
    note.textContent = excluidos > 0
      ? `Período aplicado sobre "${periodoTipo === 'fecha_ingreso' ? 'fecha de ingreso' : 'fecha de finalización'}" — ${excluidos} registro(s) sin esa fecha quedan fuera del período.`
      : '';
  } else {
    note.textContent = '';
  }

  renderStats(filtered);
  renderTable(filtered);
}

document.getElementById('searchInput').addEventListener('input', applyFilters);
document.getElementById('estadoFilter').addEventListener('change', applyFilters);
document.getElementById('comercialFilter').addEventListener('change', applyFilters);
document.getElementById('companiaFilter').addEventListener('change', applyFilters);
document.getElementById('periodoTipo').addEventListener('change', applyFilters);
document.getElementById('fechaDesde').addEventListener('change', applyFilters);
document.getElementById('fechaHasta').addEventListener('change', applyFilters);
document.getElementById('clearBtn').addEventListener('click', () => {
  document.getElementById('searchInput').value = '';
  document.getElementById('estadoFilter').value = '';
  document.getElementById('comercialFilter').value = '';
  document.getElementById('companiaFilter').value = '';
  document.getElementById('periodoTipo').value = 'fecha_ingreso';
  document.getElementById('fechaDesde').value = '';
  document.getElementById('fechaHasta').value = '';
  applyFilters();
});

async function init(){
  // 1. Mostramos el snapshot guardado al instante, para que la página nunca se vea vacía
  RECORDS = FALLBACK_RECORDS;
  rebuildFilters();
  applyFilters();
  setUpdatedBadge('fallback');

  // 2. Intentamos traer los datos en vivo desde la planilla publicada
  try{
    const live = await tryLiveFetch();
    RECORDS = live;
    rebuildFilters();
    applyFilters();
    setUpdatedBadge('live');
  }catch(err){
    setUpdatedBadge('fallback');
  }
}

init();
</script>
